<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D114D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#110C24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090714" />
    </radialGradient>

    <!-- Secondary Cyan/Indigo Glow -->
    <radialGradient id="rightGlow" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#3B1D6E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#090714" stop-opacity="0" />
    </radialGradient>

    <!-- App Icon Gradient -->
    <linearGradient id="ogIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E8E" />
      <stop offset="50%" stop-color="#A828B8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Glass card gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#090714" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#rightGlow)" />

  <!-- Subtle Grid Texture -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- LEFT CONTENT COLUMN -->
  <g transform="translate(80, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" />
    <circle cx="16" cy="17" r="5" fill="#10B981" />
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#E4E4E7">macOS 13+ · Apple Silicon &amp; Intel</text>

    <!-- Main Title & Logo Lockup -->
    <g transform="translate(0, 56)">
      <!-- App Icon (84x84) -->
      <rect x="0" y="0" width="84" height="84" rx="20" fill="url(#ogIconGrad)" filter="url(#cardShadow)" />
      <g fill="#FFFFFF">
        <path d="M 33 22 C 38 17, 44 24, 49 20 C 52 19, 56 19, 58 22 C 54 23, 50 20, 47 22 C 42 25, 37 25, 33 22 Z" />
        <path d="M 23 32 L 35 32 L 42 60 L 49 32 L 61 32 L 48 70 C 46 74, 38 74, 36 70 Z" />
      </g>

      <!-- Headings -->
      <text x="106" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Sen Việt</text>
      <text x="108" y="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="600" fill="#A855F7">VieLotusIM · Native Input Method</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="700" fill="#F4F4F5" letter-spacing="-0.5">
      Gõ tiếng Việt nguyên bản trên Mac.
    </text>
    <text x="0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="18" font-weight="400" fill="#A1A1AA">
      Không gạch chân CJK · Không quyền Trợ năng · Giữ trọn Cmd + Z
    </text>

    <!-- Key Bullet Checklist -->
    <g transform="translate(0, 265)">
      <!-- Bullet 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#10B981" fill-opacity="0.15" />
        <path d="M 6 10 L 9 13 L 14 7" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="500" fill="#E4E4E7">Thay thế trực tiếp tại con trỏ, không nuốt chữ</text>
      </g>
      <!-- Bullet 2 -->
      <g transform="translate(0, 36)">
        <circle cx="10" cy="10" r="10" fill="#10B981" fill-opacity="0.15" />
        <path d="M 6 10 L 9 13 L 14 7" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="500" fill="#E4E4E7">Nhận diện tiếng Anh thông minh (Smart Bilingual)</text>
      </g>
      <!-- Bullet 3 -->
      <g transform="translate(0, 72)">
        <circle cx="10" cy="10" r="10" fill="#10B981" fill-opacity="0.15" />
        <path d="M 6 10 L 9 13 L 14 7" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="500" fill="#E4E4E7">Phản hồi 10 - 25 µs · Đạt 98.30% trên 9.091 từ</text>
      </g>
    </g>

    <!-- Footer Tagline -->
    <text x="0" y="445" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500" fill="#71717A">
      Mã nguồn mở Apache 2.0 · Hệ sinh thái <tspan fill="#C084FC" font-weight="600">YouPersona.com</tspan>
    </text>
  </g>

  <!-- RIGHT MOCKUP: Apple Frosted Inspector Card -->
  <g transform="translate(680, 80)" filter="url(#cardShadow)">
    <!-- Card Frame (440x470) -->
    <rect width="440" height="470" rx="20" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="1.5" />
    
    <!-- Window Traffic Lights -->
    <circle cx="28" cy="26" r="6" fill="#FF5F56" />
    <circle cx="48" cy="26" r="6" fill="#FFBD2E" />
    <circle cx="68" cy="26" r="6" fill="#27C93F" />
    <text x="220" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#71717A" text-anchor="middle">Cài đặt Sen Việt</text>

    <!-- Header Inside Card -->
    <g transform="translate(196, 56)">
      <rect width="48" height="48" rx="12" fill="url(#ogIconGrad)" />
      <g fill="#FFFFFF">
        <path d="M 19 13 C 22 10, 25 14, 28 12 C 30 11, 32 11, 33 13 C 31 13.5, 29 11.5, 27 13 C 24 15, 21 15, 19 13 Z" />
        <path d="M 14 18 L 20 18 L 24 34 L 28 18 L 34 18 L 27 40 C 26 42, 22 42, 21 40 Z" />
      </g>
    </g>
    <text x="220" y="122" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sen Việt</text>
    <text x="220" y="138" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="400" fill="#A1A1AA" text-anchor="middle">Bộ gõ tiếng Việt cho macOS</text>

    <!-- Segmented Picker: Telex | VNI -->
    <g transform="translate(30, 155)">
      <rect width="380" height="34" rx="8" fill="#000000" fill-opacity="0.3" stroke="#FFFFFF" stroke-opacity="0.1" />
      <!-- Selected Telex Tab -->
      <rect x="2" y="2" width="186" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.15" />
      <text x="95" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Telex</text>
      <text x="285" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500" fill="#71717A" text-anchor="middle">VNI</text>
    </g>

    <!-- Form Section -->
    <g transform="translate(30, 205)">
      <!-- Row 1: Smart Bilingual -->
      <g transform="translate(0, 0)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Nhận diện tiếng Anh thông minh</text>
        <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="400" fill="#71717A">Tự động gỡ dấu khi gõ từ tiếng Anh</text>
        <!-- Toggle Switch ON -->
        <rect x="332" y="6" width="48" height="26" rx="13" fill="#10B981" />
        <circle cx="367" cy="19" r="11" fill="#FFFFFF" />
      </g>
      <line x1="0" y1="48" x2="380" y2="48" stroke="#FFFFFF" stroke-opacity="0.08" />

      <!-- Row 2: Modern Orthography -->
      <g transform="translate(0, 58)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Dấu chuẩn mới (hoá, thuỷ)</text>
        <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="400" fill="#71717A">Đặt dấu thanh âm chính hiện đại</text>
        <rect x="332" y="6" width="48" height="26" rx="13" fill="#10B981" />
        <circle cx="367" cy="19" r="11" fill="#FFFFFF" />
      </g>
      <line x1="0" y1="106" x2="380" y2="106" stroke="#FFFFFF" stroke-opacity="0.08" />

      <!-- Row 3: Quick Telex -->
      <g transform="translate(0, 116)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Quick Telex (cc=ch, gg=gi)</text>
        <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="400" fill="#71717A">Gõ nhanh phụ âm đầu phổ biến</text>
        <rect x="332" y="6" width="48" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.2" />
        <circle cx="345" cy="19" r="11" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Card Bottom Footer -->
    <g transform="translate(30, 420)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#71717A">YouPersona.com</text>
      <text x="380" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#818CF8" text-anchor="end">Kiểm tra bản cập nhật ↗</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="logoIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E8E" />
      <stop offset="50%" stop-color="#9C27B0" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left: Symbol Squircle (52x52) -->
  <g transform="translate(6, 6)" filter="url(#logoShadow)">
    <rect x="0" y="0" width="52" height="52" rx="12" fill="url(#logoIconGrad)" />
    <!-- White Ṽ Glyph -->
    <g fill="#FFFFFF">
      <path d="M 21 14 C 24 11, 27 15, 30 13 C 32 12, 34 12, 36 14 C 33 14.5, 31 12.5, 29 14 C 26 16, 23 16, 21 14 Z" />
      <path d="M 15 20 L 22 20 L 26 37 L 30 20 L 37 20 L 29 44 C 28 46, 24 46, 23 44 Z" />
    </g>
  </g>

  <!-- Right: Wordmark -->
  <!-- Primary Title: Sen Việt -->
  <text x="72" y="34" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Sen Việt</text>
  
  <!-- Sub-label: VieLotusIM -->
  <text x="72" y="50" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2">VieLotusIM · macOS Native</text>
</svg>

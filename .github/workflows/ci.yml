name: CI (Open-Core Desktop)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    name: macOS (Native IMK + Prebuilt Core XCFramework)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify prebuilt binary SHA-256 checksums
        run: shasum -a 256 -c Binaries/checksums.sha256

      - name: Build Open-Core targets
        run: swift build --configuration release

      - name: Build universal App bundle (VieLotusIM.app)
        run: ./scripts/build_imk.sh 2.0.0

      - name: Build installer package (VieLotusIM.pkg)
        run: ./scripts/build_pkg.sh 2.0.0

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VieLotus-macOS
          path: |
            .build/dist/VieLotusIM.pkg

  linux-build:
    name: Linux (Ubuntu 24.04 Pure C/C++ — Fcitx5, IBus & Debian Split Packages)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools, Fcitx5, and IBus dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            debhelper \
            dpkg-dev \
            extra-cmake-modules \
            fcitx5 \
            fcitx5-modules-dev \
            g++ \
            libfcitx5config-dev \
            libfcitx5core-dev \
            libfcitx5utils-dev \
            libglib2.0-dev \
            libibus-1.0-dev \
            lintian \
            ninja-build \
            pkg-config

      - name: Build Debian Split Packages via dpkg-buildpackage (Zero Swift Dependency)
        run: |
          ln -sfn CrossPlatform/packaging/debian debian
          dpkg-buildpackage -us -uc -b
          rm -f debian
          ls -lh ../*vielotus*.deb

      - name: Run Lintian check on generated Debian split packages
        run: |
          lintian --no-tag-display-limit ../*vielotus*.deb || true

      - name: Stage Linux distribution artifacts & build APT repository
        run: |
          mkdir -p dist/linux
          dpkg-deb -x Binaries/linux/vielotus_2.0.0_amd64.deb /tmp/vielotus-core
          cp /tmp/vielotus-core/usr/lib/libVieLotusCAPI.so Binaries/linux/libVieLotusCAPI.so
          cp /tmp/vielotus-core/usr/lib/libVieLotusCAPI.so dist/linux/
          cmake -B build-fcitx5 -S CrossPlatform/fcitx5-vielotus -G Ninja -DCMAKE_BUILD_TYPE=Release -DVIELOTUS_LIB_PATH="$PWD/Binaries/linux/libVieLotusCAPI.so"
          cmake --build build-fcitx5
          cmake -B build-ibus -S CrossPlatform/ibus-vielotus -G Ninja -DCMAKE_BUILD_TYPE=Release -DVIELOTUS_LIB_PATH="$PWD/Binaries/linux/libVieLotusCAPI.so"
          cmake --build build-ibus
          cp build-fcitx5/vielotus.so dist/linux/
          cp build-fcitx5/vielotus.conf dist/linux/
          cp build-ibus/ibus-engine-vielotus dist/linux/
          cp build-ibus/vielotus.xml dist/linux/
          ./scripts/build_deb.sh 2.0.0 amd64

      - name: Verify .deb installation, split packages & E2E IBus/Fcitx5 typing on Ubuntu 24.04
        run: |
          ./scripts/verify_ubuntu_deb.sh 2.0.0 amd64

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VieLotus-Linux
          path: |
            dist/linux/*.deb
            dist/linux/Packages*
            dist/linux/Release

  windows-build:
    name: Windows (x64 & ARM64 — TSF C++ Shell + Installer Verification)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify prebuilt Windows installers (x64 & ARM64)
        shell: pwsh
        run: |
          foreach ($installer in @("Binaries\windows\VieLotus-Setup-x64.exe", "Binaries\windows\VieLotus-Setup-arm64.exe")) {
            if (-not (Test-Path $installer)) {
              Write-Error "Missing $installer"
              exit 1
            }
            $item = Get-Item $installer
            Write-Host "Verified $($item.Name) ($($item.Length) bytes)"
          }

      - name: Build Windows TSF COM Shell, Inno Setup Installers & Microsoft Store MSIX (x64 & ARM64)
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1 -Version 2.0.0 -Arch all -SkipTests
          Copy-Item dist/windows/VieLotus-Setup-x64.exe Binaries/windows/VieLotus-Setup-x64.exe -Force
          Copy-Item dist/windows/VieLotus-Setup-arm64.exe Binaries/windows/VieLotus-Setup-arm64.exe -Force

      - name: Upload Windows build artifacts (x64 & ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: VieLotus-Windows
          path: |
            Binaries/windows/VieLotus-Setup-x64.exe
            Binaries/windows/VieLotus-Setup-arm64.exe
            dist/windows/msix/*

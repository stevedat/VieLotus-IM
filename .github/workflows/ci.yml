name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build all targets
        run: swift build

      - name: Run unit test suite
        run: swift test

      - name: Run 9,091-word benchmark regression suite
        run: swift run VieLotusCLI --benchmark --threshold 98.0

      - name: Build universal App bundle (VieLotusIM.app)
        run: ./scripts/build_imk.sh

      - name: Build installer package (VieLotusIM.pkg)
        run: ./scripts/build_pkg.sh

      - name: Build disk image (VieLotusIM.dmg)
        run: ./scripts/build_dmg.sh

      - name: Build disk image (VieLotusLab.dmg)
        run: ./scripts/build_lab_dmg.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VieLotus-build
          path: |
            .build/dist/VieLotusIM.app
            .build/dist/VieLotusIM.pkg
            .build/dist/VieLotusIM.dmg
            .build/dist/VieLotusLab.dmg
